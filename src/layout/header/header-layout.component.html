<header class="header">
  <div class="header__container">

    <!-- Logo -->
    <a class="header__logo" routerLink="/">
      <svg class="header__logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="20" width="21" height="21" rx="2" transform="rotate(-45 5 20)" stroke="#4DD9CF" stroke-width="2.5" fill="none"/>
      </svg>
      <span class="header__logo-text">KnowledgeHub</span>
    </a> 
    <div class="header__nav">
    <!-- Navigation -->
    <nav>
      <a class="header__nav-link" routerLink="/">الرئيسية</a>
      <a class="header__nav-link" routerLink="/courses">الدورات</a>
      <a class="header__nav-link" routerLink="/quizzes">الاختبارات</a>
      <a class="header__nav-link" routerLink="/blogs">المدونة</a>
      <a class="header__nav-link" routerLink="/paths">المسارات</a>
      <a class="header__nav-link" routerLink="/about">من نحن</a>
    </nav>

    <!-- User area -->
    <div class="header__actions">

      @if (isAuthenticated) {
        <!-- Avatar + dropdown -->
        <div class="header__user" (click)="toggleDropdown()">
          <div class="header__avatar">{{ userInitials }}</div>
          <span class="header__user-name">{{ firstName }}</span>
          <nx-icon variant="svg" icon="nx-chevron-down" size="1em" class="header__chevron" [class.header__chevron--open]="dropdownOpen"></nx-icon>

          @if (dropdownOpen) {
            <div class="header__dropdown">
              <a class="header__dropdown-item" routerLink="/profile">
                <nx-icon variant="svg" icon="nx-user" size="1em"></nx-icon> الملف الشخصي
              </a>
              <div class="header__dropdown-divider"></div>
              <button class="header__dropdown-item header__dropdown-item--danger" (click)="logout()">
                <nx-icon variant="svg" icon="nx-external-link" size="1em"></nx-icon> تسجيل الخروج
              </button>
            </div>
          }
        </div>
      } @else {
        <a class="header__login-btn" routerLink="/register">تسجيل الدخول</a>
      }

    </div>
    </div>
  </div>
</header>
